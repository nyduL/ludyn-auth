<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Nova senha • Ludyn</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="card">
    <div class="logo">🎮</div>
    <h1 id="title">Crie uma nova senha</h1>
    <p id="subtitle" class="subtitle">Escolha a nova senha da sua conta Ludyn.</p>

    <div id="loading" class="spinner"></div>

    <form id="form" class="form hidden">
      <div class="field">
        <label for="password">Nova senha</label>
        <input id="password" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="field">
        <label for="confirm">Confirmar nova senha</label>
        <input id="confirm" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <button id="submit" type="submit">TROCAR SENHA</button>
    </form>

    <div id="status" class="status hidden"></div>
    <div id="actions" class="actions hidden">
      <a id="openApp" class="button-link" href="ludyn://open">ABRIR O LUDYN</a>
    </div>
    <p class="small">A senha é alterada pelo serviço seguro de autenticação. O Ludyn não armazena sua senha em texto aberto.</p>
  </main>

  <script src="./config.js"></script>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const cfg = window.LUDYN_CONFIG || {};
    const loading = document.getElementById('loading');
    const form = document.getElementById('form');
    const status = document.getElementById('status');
    const title = document.getElementById('title');
    const subtitle = document.getElementById('subtitle');
    const submit = document.getElementById('submit');
    const password = document.getElementById('password');
    const confirm = document.getElementById('confirm');
    const actions = document.getElementById('actions');
    const openApp = document.getElementById('openApp');
    if (cfg.openAppUrl) openApp.href = cfg.openAppUrl;

    function showError(message) {
      loading.classList.add('hidden');
      form.classList.add('hidden');
      status.className = 'status error';
      status.textContent = message;
      title.textContent = 'Link inválido ou expirado';
      subtitle.textContent = 'Volte ao Ludyn e solicite um novo e-mail de recuperação.';
    }

    function showSuccess() {
      loading.classList.add('hidden');
      form.classList.add('hidden');
      status.className = 'status success';
      status.textContent = 'Senha alterada com sucesso. Você já pode voltar ao Ludyn e entrar com a nova senha.';
      title.textContent = 'Senha alterada';
      subtitle.textContent = 'Tudo certo com sua conta.';
      actions.classList.remove('hidden');
    }

    if (!cfg.supabaseUrl || !cfg.publishableKey) {
      showError('A página de autenticação ainda não foi configurada.');
    } else {
      const supabase = createClient(cfg.supabaseUrl, cfg.publishableKey, {
        auth: {
          flowType: 'implicit',
          detectSessionInUrl: true,
          persistSession: false,
          autoRefreshToken: false,
        },
      });

      const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
      const errorDescription = hash.get('error_description');

      if (errorDescription) {
        showError(decodeURIComponent(errorDescription.replace(/\+/g, ' ')));
      } else {
        let sessionResult = await supabase.auth.getSession();

        if (!sessionResult.data.session) {
          await new Promise(resolve => setTimeout(resolve, 500));
          sessionResult = await supabase.auth.getSession();
        }

        if (sessionResult.error || !sessionResult.data.session) {
          showError('Não foi possível validar este link de recuperação. Solicite um novo e-mail.');
        } else {
          loading.classList.add('hidden');
          form.classList.remove('hidden');

          form.addEventListener('submit', async (event) => {
            event.preventDefault();
            status.classList.add('hidden');

            const newPassword = password.value;
            const confirmation = confirm.value;

            if (newPassword.length < 8) {
              status.className = 'status error';
              status.textContent = 'A nova senha precisa ter pelo menos 8 caracteres.';
              return;
            }

            if (newPassword !== confirmation) {
              status.className = 'status error';
              status.textContent = 'As duas senhas precisam ser iguais.';
              return;
            }

            submit.disabled = true;
            submit.textContent = 'SALVANDO...';

            const { error } = await supabase.auth.updateUser({
              password: newPassword,
            });

            if (error) {
              submit.disabled = false;
              submit.textContent = 'TROCAR SENHA';
              status.className = 'status error';
              status.textContent = error.message || 'Não foi possível alterar a senha.';
              return;
            }

            try { await supabase.auth.signOut(); } catch (_) {}
            history.replaceState({}, document.title, location.pathname);
            showSuccess();
          });
        }
      }
    }
  </script>
</body>
</html>
