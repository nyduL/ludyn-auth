<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Confirmar e-mail • Ludyn</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="card">
    <div class="logo">🎮</div>
    <h1 id="title">Confirmando seu e-mail</h1>
    <p id="subtitle" class="subtitle">Só um instante.</p>
    <div id="spinner" class="spinner"></div>
    <div id="status" class="status hidden"></div>
    <p class="small">Depois, volte ao aplicativo Ludyn e entre normalmente.</p>
  </main>
  <script src="./config.js"></script>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const cfg = window.LUDYN_CONFIG || {};
    const title = document.getElementById('title');
    const subtitle = document.getElementById('subtitle');
    const spinner = document.getElementById('spinner');
    const status = document.getElementById('status');

    function show(message, kind='success') {
      spinner.classList.add('hidden');
      status.className = `status ${kind}`;
      status.textContent = message;
      title.textContent = kind === 'success'
        ? 'E-mail confirmado'
        : 'Não foi possível confirmar';
      subtitle.textContent = kind === 'success'
        ? 'Sua conta Ludyn está pronta.'
        : 'O link pode ter expirado ou já ter sido usado.';
    }

    if (!cfg.supabaseUrl || !cfg.publishableKey) {
      show('A página de autenticação ainda não foi configurada.', 'error');
    } else {
      const supabase = createClient(cfg.supabaseUrl, cfg.publishableKey, {
        auth: {
          flowType: 'implicit',
          detectSessionInUrl: true,
          persistSession: false,
          autoRefreshToken: false,
        },
      });

      const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
      const errorDescription = hash.get('error_description');

      if (errorDescription) {
        show(decodeURIComponent(errorDescription.replace(/\+/g, ' ')), 'error');
      } else {
        const { data, error } = await supabase.auth.getSession();

        if (error) {
          show('Não foi possível validar este link. Solicite um novo e-mail.', 'error');
        } else if (data.session) {
          show('E-mail confirmado com sucesso. Você já pode voltar ao Ludyn.');
        } else {
          // Em alguns navegadores o processamento automático ocorre alguns ms depois.
          await new Promise(resolve => setTimeout(resolve, 500));
          const retry = await supabase.auth.getSession();
          if (retry.data.session) {
            show('E-mail confirmado com sucesso. Você já pode voltar ao Ludyn.');
          } else {
            show('Este link não contém uma sessão válida. Tente entrar no app; se necessário, solicite um novo e-mail.', 'error');
          }
        }
      }
    }
  </script>
</body>
</html>
